<style>
  :root{
    --ink:#231F20;
    --paper:#FFFFFF;
    --mute:#231F20B3;
    --line:#231F2029;
    --c1:#FFD530;
    --c3:#231F20;
    --now:var(--c1);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body,button,input{font-weight:700}   /* 한글 = Pretendard Bold */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Roboto Flex","Pretendard",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .wrap{
    height:100%;
    max-width:1600px;
    margin:0 auto;
    padding:16px;
    padding-block:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px 28px;
    flex-wrap:wrap;
  }

  .eyebrow{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0;
  }
  h1{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 145,'wght' 900,'opsz' 144;
    font-size:clamp(1.9rem,5.4vh,3.4rem);
    line-height:.9;
    letter-spacing:-.02em;
    margin:.12em 0 0;
    white-space:nowrap;
  }
  h1 em{font-style:normal;color:var(--ink)}

  /* ── 입력 ── */
  .setup{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
  .field{
    display:flex;align-items:baseline;gap:8px;
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:6px 8px 6px 18px;
  }
  .field label{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
  }
  input[type=number]{
    width:3.4em;
    background:transparent;border:0;color:var(--ink);
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 100,'wght' 800;
    font-variant-numeric:tabular-nums;
    font-size:20px;text-align:right;
    padding:4px 6px;
  }
  input[type=number]:focus{outline:2px solid var(--c3);outline-offset:2px;border-radius:8px}
  .unit{font-size:.9rem;color:var(--mute);padding-right:10px}
  .preset{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 85,'wght' 700;
    font-size:15px;
    padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--line);background:transparent;color:var(--mute);
    cursor:pointer;transition:.15s;
  }
  .preset:hover{border-color:var(--c3);color:var(--ink)}
  .preset[aria-pressed=true]{border-color:var(--c3);background:var(--c3);color:var(--paper)}

  /* ── 카운터 ── */
  .stage{
    flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;
    position:relative;
  }
  .time{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 151,'wght' 900,'opsz' 144;
    font-variant-numeric:tabular-nums;
    font-size:min(34vh,20vw);
    line-height:.86;
    letter-spacing:-.02em;
    color:var(--now);
    transition:color .3s;
  }
  .time.solo{font-size:min(56vh,40vw)}
  .time.beat{animation:beat .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes beat{0%{transform:scale(1.14)}100%{transform:scale(1)}}
  .time.over{font-size:min(20vh,13vw);color:var(--c3)}

  .track{
    width:min(1100px,92%);
    height:8px;border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .fill{
    height:100%;width:100%;
    background:var(--now);
    transform-origin:left;
    transition:background .3s;
  }
  .note{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 600;
    font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--mute);
  }

  /* ── 버튼 ── */
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
  button.main{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 100,'wght' 800;
    font-size:20px;letter-spacing:.02em;
    padding:clamp(9px,1.6vh,15px) clamp(26px,3.4vw,44px);
    border-radius:999px;
    border:1.5px solid var(--c1);background:var(--c1);color:var(--on,var(--paper));
    cursor:pointer;transition:background .16s,color .16s;
  }
  button.main:hover{background:var(--c3);border-color:var(--c3);color:var(--c1)}
  button.main.alt:not(:hover){color:var(--ink)}   /* 일시정지 · 이어서 = 검정 글자 */
  button.ghost{
    font-family:"Roboto Flex","Pretendard",sans-serif;
    font-variation-settings:'wdth' 100,'wght' 800;
    font-size:20px;
    padding:clamp(9px,1.6vh,15px) clamp(22px,3vw,34px);
    border-radius:999px;
    border:1.5px solid var(--line);background:transparent;color:var(--ink);
    cursor:pointer;transition:.16s;
  }
  button.ghost:hover{background:var(--c3);color:var(--paper);border-color:var(--c3)}
  button:focus-visible{outline:3px solid var(--c3);outline-offset:3px}

  /* ── 긴장 연출 ── */
  body.tense{animation:vign .5s steps(1) infinite}
  @keyframes vign{
    0%{box-shadow:inset 0 0 26vh -12vh var(--c1)}
    50%{box-shadow:inset 0 0 8vh -12vh var(--c1)}
  }
  .stage.shake{animation:shake .1s linear infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:20;background:var(--c1);opacity:0}
  #flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  @media (max-aspect-ratio:1/1){
    .top{align-items:stretch;flex-direction:column}
    .setup{justify-content:flex-start}
    .time{font-size:min(22vh,26vw)}
    .time.solo{font-size:min(38vh,56vw)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>

<div class="wrap">
  <div class="top">
    <header>
      <p class="eyebrow">NHN Design</p>
      <h1>COUNT <em>DOWN</em></h1>
    </header>

    <div class="setup">
      <div class="field">
        <label for="min">Min</label>
        <input id="min" type="number" min="0" max="180" step="1" value="5" inputmode="numeric">
        <span class="unit">분</span>
      </div>
      <button class="preset" data-m="20">20분</button>
      <button class="preset" data-m="10">10분</button>
      <button class="preset" data-m="7">7분</button>
      <button class="preset" data-m="5" aria-pressed="true">5분</button>
      <button class="preset" data-m="3">3분</button>
      <button class="preset" data-m="1">1분</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="time" id="time">05:00</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <p class="note" id="note">Space 로 시작 · 정지</p>
  </div>

  <div class="bar">
    <button class="main" id="go">시작</button>
    <button class="ghost" id="reset">리셋</button>
  </div>

  <div id="flash"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), fill = $('fill'), note = $('note'), stage = $('stage');
  const btnGo = $('go'), btnReset = $('reset'), minInput = $('min'), flash = $('flash');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 사운드 (라이브러리 없이 WebAudio) ── */
  let ac, master;
  function audio(){
    if (!ac){
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = .9;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 12; comp.release.value = .25;
      master.connect(comp).connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, {dur = .12, type = 'square', gain = .12, to = 0, delay = 0} = {}){
    try{
      const a = audio(), t = a.currentTime + delay;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + dur + .02);
    }catch(e){}
  }
  function noise(dur, {gain = .3, from = 300, to = 5000, type = 'bandpass', q = 3, attack = .85, delay = 0} = {}){
    try{
      const a = audio(), t = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = buf;
      const f = a.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(from, t);
      f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + dur * attack);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(f).connect(g).connect(master);
      src.start(t); src.stop(t + dur);
    }catch(e){}
  }
  const crash = (dur = 1.2, gain = .38, delay = 0) =>
    noise(dur, {gain, from: 9000, to: 4000, type: 'highpass', q: .7, attack: .02, delay});
  const boom = (gain = .5, delay = 0) => tone(150, {dur: .7, type: 'sine', gain, to: 34, delay});
  const stab = (root, {delay = 0, gain = .2} = {}) =>
    [1, 1.26, 1.5, 2].forEach(r => tone(root * r, {dur: .34, type: 'sawtooth', gain, delay}));

  const sfx = {
    start: () => { stab(523, {gain: .18}); boom(.4); },
    pause: () => tone(330, {dur: .16, type: 'square', gain: .16, to: 180}),
    // 10초 카운트 — 남은 초가 줄수록 높고 세게
    beat: s => {
      const up = (10 - s) / 9;                       // 0 → 1
      tone(420 + up * 380, {dur: .09, type: 'square', gain: .16 + up * .16});
      tone(105 + up * 40, {dur: .2, type: 'sine', gain: .3 + up * .2});
      if (s <= 3){ crash(.35, .22); tone(1200, {dur: .06, type: 'square', gain: .14}); }
    },
    riser: () => {                                    // 10초 진입 순간
      noise(1.6, {gain: .22, from: 240, to: 6500, q: 6});
      tone(220, {dur: 1.6, type: 'sawtooth', gain: .1, to: 900});
    },
    end: () => {
      crash(2.4, .45); boom(.8);
      [0, .5, 1].forEach(d => {                       // 사이렌 3연타
        tone(880, {dur: .38, type: 'sawtooth', gain: .24, to: 620, delay: d});
        tone(660, {dur: .38, type: 'square', gain: .18, to: 440, delay: d + .18});
        crash(.8, .28, d);
      });
      tone(60, {dur: 2.4, type: 'sine', gain: .45});
    }
  };

  /* ── 타이머 ── */
  let total = 5 * 60000;   // 설정값(ms)
  let remain = total;      // 남은 시간(ms)
  let endAt = 0;           // 목표 시각
  let running = false, raf = 0, lastSec = -1, tensed = false;

  const mmss = ms => {
    const s = Math.ceil(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  };

  function render(){
    const sec = Math.ceil(remain / 1000);
    const solo = running && sec <= 10 && sec > 0;

    timeEl.textContent = remain <= 0 ? "TIME'S UP" : solo ? sec : mmss(remain);
    timeEl.className = 'time' + (remain <= 0 ? ' over' : solo ? ' solo' : '');
    fill.style.transform = `scaleX(${total ? Math.max(0, remain / total) : 0})`;

    // 10초 전부터 마젠타 + 비네트, 3초 전부터 흔들림
    const tense = running && sec <= 10 && sec > 0;
    document.documentElement.style.setProperty('--now', tense ? 'var(--c3)' : 'var(--c1)');
    document.body.classList.toggle('tense', tense && !reduced);
    stage.classList.toggle('shake', tense && sec <= 3 && !reduced);

    if (sec !== lastSec){
      if (tense){
        if (!tensed){ tensed = true; sfx.riser(); }
        sfx.beat(sec);
        if (!reduced){ timeEl.classList.add('beat'); }
        note.textContent = sec <= 3 ? 'Final seconds' : 'Last 10 seconds';
      }
      lastSec = sec;
    }
  }

  function loop(){
    remain = Math.max(0, endAt - performance.now());
    render();
    if (remain <= 0) finish();
    else raf = requestAnimationFrame(loop);
  }

  function start(){
    if (running || total <= 0) return;
    if (remain <= 0) remain = total;
    endAt = performance.now() + remain;
    running = true; tensed = false; lastSec = -1;
    btnGo.textContent = '일시정지'; btnGo.classList.add('alt');
    note.textContent = 'Running';
    sfx.start();
    loop();
  }

  function pause(){
    if (!running) return;
    cancelAnimationFrame(raf);
    remain = Math.max(0, endAt - performance.now());
    running = false;
    btnGo.textContent = '이어서'; btnGo.classList.add('alt');
    note.textContent = 'Paused';
    document.body.classList.remove('tense');
    stage.classList.remove('shake');
    render();
    sfx.pause();
  }

  function finish(){
    cancelAnimationFrame(raf);
    running = false; remain = 0;
    btnGo.textContent = '시작'; btnGo.classList.remove('alt');
    note.textContent = "Time's up";
    document.body.classList.remove('tense');
    stage.classList.remove('shake');
    document.documentElement.style.setProperty('--now', 'var(--c1)');
    render();
    sfx.end();
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  }

  // 포인트 컬러 — 입력 분이 이 값 이상이면 해당 색 (사이 값은 아래 단계 색)
  const COLOR = [[20,'#9A7AD6'],[10,'#69B3E3'],[7,'#39B54A'],[5,'#FFD530'],[3,'#F58A45'],[0,'#F1729E']];

  function setMinutes(m){
    total = Math.max(0, Math.min(180, m)) * 60000;
    const c1 = COLOR.find(([t]) => total >= t * 60000)[1];
    document.documentElement.style.setProperty('--c1', c1);
    document.documentElement.style.setProperty('--on', c1 === '#FFD530' ? 'var(--ink)' : 'var(--paper)');   // 노랑 위 글씨만 검정
    cancelAnimationFrame(raf);
    running = false; remain = total; lastSec = -1; tensed = false;
    btnGo.textContent = '시작'; btnGo.classList.remove('alt');
    note.textContent = 'Space 로 시작 · 정지';
    document.body.classList.remove('tense');
    stage.classList.remove('shake');
    document.documentElement.style.setProperty('--now', 'var(--c1)');
    render();
  }

  btnGo.onclick = () => running ? pause() : start();
  btnReset.onclick = () => setMinutes(Number(minInput.value) || 0);
  minInput.oninput = () => {
    document.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed','false'));
    setMinutes(Number(minInput.value) || 0);
  };
  document.querySelectorAll('.preset').forEach(b => b.onclick = () => {
    document.querySelectorAll('.preset').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    minInput.value = b.dataset.m;
    setMinutes(Number(b.dataset.m));
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT'){
      e.preventDefault();
      running ? pause() : start();
    }
  });

  setMinutes(5);

  // self-check: 주소 끝에 #test
  if (location.hash === '#test'){
    console.assert(mmss(300000) === '05:00', mmss(300000));
    console.assert(mmss(61000)  === '01:01', mmss(61000));
    console.assert(mmss(999)    === '00:01', mmss(999));   // 올림 — 0이 아닌 동안 00:00으로 안 떨어짐
    console.assert(mmss(0)      === '00:00', mmss(0));
    console.log('selftest ok');
  }
</script>
